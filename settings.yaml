apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-halo-gui-setting
spec:
  forms:
    - group: home
      label: 首页
      formSchema:
        - $formkit: radio
          name: background_mode
          id: background_mode
          label: 首页背景
          help: 背景图仅作用于首页首屏区域，不会遮挡文章列表。
          value: "default"
          options:
            - label: 内置水墨图
              value: "default"
            - label: 自定义图片
              value: "custom"
            - label: 不显示
              value: "none"
        - $formkit: attachment
          name: background_image
          key: background_image
          label: 背景图
          help: 可直接上传、从附件库选择，或填写图片地址。建议使用横向、画面简洁的图片。
          value: ""
          if: "$get(background_mode).value == 'custom'"
        - $formkit: attachment
          name: background_image_mobile
          key: background_image_mobile
          label: 手机端背景图
          help: 可选。屏幕宽度不超过 720px 时使用，建议竖向或方形图片；留空则沿用上方背景图。
          value: ""
          if: "$get(background_mode).value == 'custom'"
        - $formkit: select
          name: background_fit
          key: background_fit
          label: 填充方式
          value: "cover"
          options:
            - label: 铺满首屏（自动裁切）
              value: "cover"
            - label: 完整显示（可能留白）
              value: "contain"
            - label: 按宽度铺满（保持比例，裁去超出首屏的部分）
              value: "width"
          if: "$get(background_mode).value == 'custom'"
        - $formkit: select
          name: background_position
          key: background_position
          label: 对齐位置
          help: 图片被裁切时，优先保留的部分。
          value: "center"
          options:
            - label: 居中
              value: "center"
            - label: 顶部
              value: "top"
            - label: 底部
              value: "bottom"
          if: "$get(background_mode).value == 'custom'"
        - $formkit: number
          name: background_opacity
          key: background_opacity
          label: 背景浓淡
          help: 10–100，数值越小背景越淡，题字越清晰。
          value: 100
          min: 10
          max: 100
          step: 5
          if: "$get(background_mode).value != 'none'"
        - $formkit: checkbox
          name: background_fade
          key: background_fade
          label: 底部渐隐
          help: 背景底部晕染进纸色，与文章列表自然衔接。
          value: true
          if: "$get(background_mode).value == 'custom'"
        - $formkit: checkbox
          name: hero_enabled
          id: hero_enabled
          label: 显示首页题头
          help: 关闭后不显示题字、诗词与导语（首页背景随之隐藏），导航栏下方直接显示文章列表。
          value: true
        - $formkit: text
          name: hero_title
          key: hero_title
          label: 首页题字
          help: 显示在首页诗词上方。留空时显示“归”。
          value: "归"
          if: "$get(hero_enabled).value"
        - $formkit: textarea
          name: hero_poem
          key: hero_poem
          label: 首页诗词
          help: 显示在首页题字下方，支持换行。留空时显示主题默认诗词。
          value: "醉里青山日月亏\n浮云老\n照影共执杯"
          if: "$get(hero_enabled).value"
        - $formkit: textarea
          name: hero_summary
          key: hero_summary
          label: 首页导语
          help: 显示在首页大标题下方。留空则不显示。
          value: ""
          if: "$get(hero_enabled).value"
        - $formkit: checkbox
          name: posts_enabled
          id: posts_enabled
          label: 显示最近文章
          help: 首页各区块按“最近文章、瞬间、图库”顺序纵向排列，可分别开关；序号随开启的区块自动编排。
          value: true
        - $formkit: number
          name: home_post_count
          key: home_post_count
          if: "$get(posts_enabled).value"
          label: 最近文章数量
          help: 首页“最近文章”显示的篇数，第一篇以大图展示，其余为列表。完整列表见归档页。
          value: 5
          min: 1
          max: 20
          step: 1
        - $formkit: checkbox
          name: moments_enabled
          id: moments_enabled
          label: 显示瞬间
          help: 需要安装并启用“瞬间”插件；暂无瞬间时自动隐藏。
          value: true
        - $formkit: number
          name: home_moment_count
          key: home_moment_count
          label: 瞬间数量
          value: 3
          min: 1
          max: 12
          step: 1
          if: "$get(moments_enabled).value"
        - $formkit: checkbox
          name: photos_enabled
          id: photos_enabled
          label: 显示图库
          help: 需要安装并启用“图库”插件；暂无图片时自动隐藏。
          value: true
        - $formkit: number
          name: home_photo_count
          key: home_photo_count
          label: 图库图片数量
          help: 第一张以大图展示，填写 5、9、13 等数量可恰好排满网格。
          value: 9
          min: 1
          max: 24
          step: 1
          if: "$get(photos_enabled).value"
    - group: nav
      label: 导航
      formSchema:
        - $formkit: checkbox
          name: posts_enabled
          id: nav_posts_enabled
          label: 导航栏显示文章入口
          help: 在第一个菜单项（通常是首页）之后加入“文章”，链接到归档页。若菜单中已有指向 /archives 的菜单项则不重复添加。
          value: true
        - $formkit: text
          name: posts_label
          key: nav_posts_label
          label: 文章入口名称
          value: "文章"
          if: "$get(nav_posts_enabled).value"
    - group: styles
      label: 样式
      formSchema:
        - $formkit: color
          name: primary_color
          label: 主配色
          help: 作为朱砂点睛色，用于题字、印章、标签、链接与悬停状态。
          value: "#d33f4f"
        - $formkit: color
          name: background_color
          label: 背景颜色
          value: "#f2f2f2"
