<include src="layout.html">
  <template name="head">
    <title th:text="|Categories - ${site.title}|">Categories</title>
  </template>

  <h1>Categories</h1>
  <ul class="category-list">
    <th:block th:each="cat : ${categories}">
      <li>
        <a
          th:href="@{${cat.status.permalink}}"
          th:text="|${cat.spec.displayName} (${cat.postCount ?: 0})|"
          class="category"
        ></a>
      </li>
      <li th:each="child : ${cat.children}">
        <a
          th:href="@{${child.status.permalink}}"
          th:text="|${cat.spec.displayName} / ${child.spec.displayName} (${child.postCount ?: 0})|"
          class="category"
        ></a>
      </li>
    </th:block>
  </ul>
  <p class="empty-state" th:if="${#lists.isEmpty(categories)}">暂无分类。</p>
</include>
