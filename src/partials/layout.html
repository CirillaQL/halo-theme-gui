<!doctype html>
<html
  lang="zh-CN"
  xmlns:th="http://www.thymeleaf.org"
  th:style="|--paper: ${theme.config.styles.background_color ?: '#f2f2f2'}; --accent: ${theme.config.styles.primary_color ?: '#d33f4f'};|"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" th:content="${theme.config.styles.background_color ?: '#f2f2f2'}" />
    <slot name="head">
      <title th:text="${site.title}">Site Title</title>
    </slot>
    <script type="module" src="./js/main.ts"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-title" th:href="@{/}" th:text="${site.title}">Site Title</a>
        <nav class="site-nav" th:with="menu = ${menuFinder.getPrimary()}">
          <ul>
            <li th:each="item : ${menu.menuItems}">
              <a
                th:href="@{${item.status.href}}"
                th:text="${item.status.displayName}"
                th:target="${item.spec.target?.value}"
              ></a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main
      class="site-main"
      th:classappend="${_templateId == 'index'} ? (${#strings.isEmpty(theme.config.home.background_image)} ? ' site-main-home' : ' site-main-home has-custom-bg')"
      th:style="${_templateId == 'index' && not #strings.isEmpty(theme.config.home.background_image)} ? |--home-background-image: url('${theme.config.home.background_image}')|"
    >
      <div class="container">
        <slot />
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p th:text="${theme.config.basic.custom_footer ?: site.title}"></p>
        <halo:footer />
      </div>
    </footer>
  </body>
</html>
