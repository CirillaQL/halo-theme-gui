<!doctype html>
<html
  lang="zh-CN"
  xmlns:th="http://www.thymeleaf.org"
  th:style="|--paper: ${theme.config.styles.background_color ?: '#f2f2f2'}; --accent: ${theme.config.styles.primary_color ?: '#d33f4f'};|"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" th:content="${theme.config.styles.background_color ?: '#f2f2f2'}" />
    <slot name="head">
      <title th:text="${site.title}">Site Title</title>
    </slot>
    <script type="module" src="./js/main.ts"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-title" th:href="@{/}" th:text="${site.title}">Site Title</a>
        <nav class="site-nav" th:with="menu = ${menuFinder.getPrimary()}">
          <ul>
            <li th:each="item : ${menu.menuItems}">
              <a
                th:href="@{${item.status.href}}"
                th:text="${item.status.displayName}"
                th:target="${item.spec.target?.value}"
              ></a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <th:block
      th:with="
        isHome = ${_templateId == 'index'},
        home = ${theme.config.home},
        bgImage = ${home?.background_image},
        bgMobileImage = ${home?.background_image_mobile},
        bgMode = ${home?.background_mode ?: (#strings.isEmpty(bgImage) ? 'default' : 'custom')},
        bgCustom = ${bgMode == 'custom' && not #strings.isEmpty(bgImage)},
        bgFade = ${#strings.toString(home?.background_fade) != 'false'},
        heroEnabled = ${#strings.toString(home?.hero_enabled) != 'false'},
        bgSize = ${home?.background_fit == 'contain' ? 'contain' : (home?.background_fit == 'width' ? '100% auto' : 'cover')},
        bgPosition = ${home?.background_position == 'top' ? 'center top' : (home?.background_position == 'bottom' ? 'center bottom' : 'center')},
        bgOpacity = ${home?.background_opacity ?: 100},
        bgImageVars = ${bgCustom} ? |--home-background-image: url('${bgImage}'); --home-background-image-mobile: url('${#strings.isEmpty(bgMobileImage) ? bgImage : bgMobileImage}');| : '',
        homeClass = (${bgMode == 'none'} ? ' site-main-home no-home-bg' : (${bgCustom} ? (${bgFade} ? ' site-main-home has-custom-bg' : ' site-main-home has-custom-bg no-home-bg-fade') : ' site-main-home')) + (${heroEnabled} ? '' : ' no-home-hero')
      "
    >
      <main
        class="site-main"
        th:classappend="${isHome} ? ${homeClass}"
        th:style="${isHome} ? |--home-bg-size: ${bgSize}; --home-bg-position: ${bgPosition}; --home-bg-opacity: ${bgOpacity}; ${bgImageVars}|"
      >
        <div class="container">
          <slot />
        </div>
      </main>
    </th:block>

    <footer class="site-footer">
      <div class="container">
        <p th:text="${theme.config.basic.custom_footer ?: site.title}"></p>
        <halo:footer />
      </div>
    </footer>
  </body>
</html>
