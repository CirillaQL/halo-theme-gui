<include src="layout.html">
  <template name="head">
    <title th:text="|Tags - ${site.title}|">Tags</title>
  </template>

  <h1>Tags</h1>
  <ul class="tag-list">
    <li th:each="tag : ${tags}">
      <a
        th:href="@{${tag.status.permalink}}"
        th:text="|${tag.spec.displayName} (${tag.postCount ?: 0})|"
        class="tag"
      ></a>
    </li>
  </ul>
  <p class="empty-state" th:if="${#lists.isEmpty(tags)}">暂无标签。</p>
</include>
